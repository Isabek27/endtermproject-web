<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MatchIQ Pro: учебный сайт футбольной аналитики">
  <title>Матч-центр | MatchIQ Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="index.html"><span class="brand-icon"><i class="fa-solid fa-futbol"></i></span><span>MatchIQ<b>Pro</b></span></a>
      <button class="btn menu-toggle d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarNav" aria-controls="sidebarNav" aria-expanded="false">☰ Меню</button>
      <nav id="sidebarNav" class="nav collapse d-lg-block" aria-label="Главное меню">
        <a class="nav-link" href="index.html"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i>Дашборд</a>
<a class="nav-link active" href="match.html" aria-current="page"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i>Матчи</a>
<a class="nav-link" href="standings.html"><i class="fa-solid fa-trophy" aria-hidden="true"></i>Турниры</a>
<a class="nav-link" href="players.html"><i class="fa-solid fa-user" aria-hidden="true"></i>Игроки</a>
<a class="nav-link" href="ai.html"><i class="fa-solid fa-brain" aria-hidden="true"></i>AI Аналитика</a>
<a class="nav-link" href="contact.html"><i class="fa-solid fa-envelope" aria-hidden="true"></i>Контакты</a>
      </nav>
    </aside>
    <div class="page">
      <header class="topbar">
        <h1>Матч-центр</h1>
        <div class="header-tools">
          <input class="search" type="search" id="siteSearch" placeholder="Поиск на странице..." aria-label="Поиск на странице">
          <button class="btn" type="button" id="themeButton" aria-label="Переключить тему"><i class="fa-solid fa-moon"></i> Тема</button>
        </div>
      </header>
      <main class="content">

        <p class="demo">Матчи — учебные примеры. Статус LIVE здесь не означает трансляцию настоящего матча.</p>
        <div class="toolbar" role="group" aria-label="Фильтры матчей">
          <button class="btn filter-btn active" type="button" data-filter="all">Все</button>
          <button class="btn filter-btn" type="button" data-filter="live">LIVE</button>
          <button class="btn filter-btn" type="button" data-filter="finished">Завершённые</button>
          <button class="btn filter-btn" type="button" data-filter="upcoming">Будущие</button>
          <button class="btn filter-btn" type="button" data-filter="favorites">★ Избранное</button>
        </div>
        <section id="matchList" class="grid-2" aria-label="Список матчей"></section>
        <p id="emptyNote" class="empty" hidden>Матчи не найдены.</p>

      </main>
      <footer class="footer">MatchIQ Pro · Student endterm project · Demo data, not live results</footer>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/jquery.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/jquery-features.js"></script>
</body>
</html>
